# Goes to /etc/nginx/conf.d/anoma-limits.conf (http context).
# Brute-force protection for /api/login (the app has its own limiter too).
limit_req_zone $binary_remote_addr zone=anoma_login:10m rate=5r/m;
# Registration / password-reset / resend endpoints: mail-sending abuse protection (the app limits too).
limit_req_zone $binary_remote_addr zone=anoma_register:10m rate=10r/m;
