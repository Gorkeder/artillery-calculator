    # --- ANOMA map: page, API, uploads ---
    # Paste inside the HTTPS server { } block of /etc/nginx/sites-available/anoma, before `location /`.
    location = /map {
        try_files /map.html =404;
    }

    location = /api/login {
        limit_req zone=anoma_login burst=5 nodelay;
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /account {
        try_files /account.html =404;
    }

    location = /privacy {
        try_files /privacy.html =404;
    }

    # Clan pages: one HTML file serves the catalog, a profile, the join screen and the clan itself.
    location = /clan {
        try_files /clan.html =404;
    }

    location = /clans {
        try_files /clan.html =404;
    }

    location ^~ /clans/ {
        try_files /clan.html =404;
    }

    location ^~ /clan/join/ {
        try_files /clan.html =404;
    }

    # Mail-sending endpoints: stricter limit. A regex location wins over the plain prefix `location /api/`
    # below and does not overlap with the exact `location = /api/login`.
    location ~ ^/api/(register|forgot-password|resend-verification)$ {
        limit_req zone=anoma_register burst=5 nodelay;
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /uploads/ {
        alias /var/lib/anoma/uploads/;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
