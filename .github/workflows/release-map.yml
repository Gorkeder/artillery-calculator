name: Release map

# Публикует карту (map.js) в день релиза. До этого момента в репозитории
# лежит только зашифрованный map.enc — вытащить карту нельзя.
#
# Требуется секрет репозитория MAP_KEY (Settings -> Secrets and variables ->
# Actions -> New repository secret), значение — 64 hex-символа.

on:
  schedule:
    # 13:00 UTC = 16:00 МСК, 6 сентября. GitHub может запустить с задержкой
    # в несколько минут — карта откроется чуть позже 16:00, но не раньше.
    - cron: '0 13 6 9 *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-map
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Decrypt map
        env:
          MAP_KEY: ${{ secrets.MAP_KEY }}
        run: node tools/decrypt-map.js

      - name: Commit and push map.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f map.js
          if git diff --cached --quiet; then
            echo "map.js уже опубликована — нечего коммитить"
            exit 0
          fi
          git commit -m "Release: publish map"
          git push
